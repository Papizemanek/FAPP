<!doctype html>
<html lang="__LANG__" dir="__DIR__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{pageTitle}}</title>
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<style>
  :root {
    --bg: #121014; --surface: #1C181F; --line: #2A2430; --text: #F5EFE9; --muted: #B4AAB8;
    --accent: #FF6B8B; --safe: #62E0B5; --warn: #F5B94A; --alarm: #FF8A80; --sos: #FF4B3E;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 20px 16px 32px; display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; }
  .logo svg { color: var(--accent); flex: none; }
  .muted { color: var(--muted); font-size: 14px; }
  .card { padding: 20px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .status h1 { margin: 0; font-size: 28px; line-height: 1.15; }
  .status p { margin: 0; }
  .status.ok { background: #15241F; border-color: #2E4A41; } .status.ok h1 { color: var(--safe); }
  .status.overdue { background: #2A2418; border-color: #4A3E22; } .status.overdue h1 { color: var(--warn); }
  .status.alarm { background: #2A1918; border-color: #4A2B28; } .status.alarm h1 { color: var(--alarm); }
  .status.ended h1 { color: var(--text); }
  #map { height: 240px; border-radius: 20px; border: 1px solid var(--line); background: #1E1B22; }
  .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .partner { flex-direction: row; align-items: center; gap: 14px; }
  .partner img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; flex: none; background: #3B2A35; }
  a.button { display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 999px; font-weight: 800; font-size: 17px; text-decoration: none; }
  a.sos { background: var(--sos); color: #fff; }
  a.ghost { border: 1.5px solid #4A4250; color: var(--text); font-weight: 700; font-size: 15px; min-height: 44px; padding: 0 16px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <!-- Bez názvu a loga aplikace: stránku může vidět i někdo další v telefonu důvěryhodné osoby. -->
    <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6l7-3z"/><path d="M9 11.5l2 2 4-4"/></svg><span data-i18n="header">{{header}}</span></div>
  </header>

  <section id="status" class="card status" aria-live="polite">
    <h1 id="title">{{loading}}</h1>
    <p id="detail"></p>
  </section>

  <a id="call112" class="button sos" href="tel:112" data-i18n="call" hidden>{{call}}</a>

  <div id="mapWrap" hidden>
    <div id="map" role="img" data-i18n-aria="mapLabel" aria-label="{{mapLabel}}"></div>
    <div class="row" style="margin-top: 8px">
      <span id="locInfo" class="muted"></span>
      <a id="openMaps" class="button ghost" target="_blank" rel="noopener noreferrer" data-i18n="openMaps">{{openMaps}}</a>
    </div>
  </div>

  <section id="partner" class="card partner" hidden>
    <img id="partnerPhoto" data-i18n-alt="partnerPhotoAlt" alt="{{partnerPhotoAlt}}" hidden>
    <div>
      <div class="muted" id="partnerLead"></div>
      <div style="font-weight: 700; font-size: 17px" id="partnerName"></div>
      <div class="muted" id="meetInfo"></div>
    </div>
  </section>

  <p class="muted" id="footer" style="text-align: center; font-size: 13px"></p>
</main>

<script src="/vendor/leaflet/leaflet.js"></script>
<!-- Texty stránky (jmenný prostor „share“ ze shared/i18n/server) vkládá server podle ?lang= nebo jazyka prohlížeče. -->
<script id="i18n" type="application/json">__I18N__</script>
<script>
  const token = location.pathname.split('/').pop();
  const $ = (id) => document.getElementById(id);
  let I18N = JSON.parse($('i18n').textContent);

  function t(key, params = {}) {
    let value = I18N.messages[key];
    // rod: { man, woman, other } podle toho, koho se text týká
    if (value && typeof value === 'object' && ('man' in value || 'woman' in value)) value = value[params.gender] ?? value.other;
    if (value && typeof value === 'object') {
      let category = 'other';
      try {
        category = new Intl.PluralRules(I18N.locale).select(Number(params.count ?? 0));
      } catch {
        category = params.count === 1 ? 'one' : 'other';
      }
      value = value[category] ?? value.other;
    }
    if (typeof value !== 'string') return key;
    return value.replace(/\{(\w+)\}/g, (m, name) => (params[name] === undefined ? m : String(params[name])));
  }

  const intl = () => I18N.locale;
  const time = (iso) => new Date(iso).toLocaleTimeString(intl(), { hour: '2-digit', minute: '2-digit' });
  const dateTime = (iso) => new Date(iso).toLocaleString(intl(), { weekday: 'short', day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' });
  const percent = (x) => new Intl.NumberFormat(intl(), { style: 'percent', maximumFractionDigits: 0 }).format(x);
  const ago = (iso) => {
    const min = Math.round((Date.now() - Date.parse(iso)) / 60000);
    return min < 1 ? t('locationJustNow') : t('locationAgo', { count: min });
  };
  let map, marker, circle, last;

  function applyStatic() {
    const number = I18N.emergency;
    document.documentElement.lang = I18N.locale;
    document.documentElement.dir = I18N.dir;
    document.title = t('pageTitle');
    for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n, { number });
    for (const el of document.querySelectorAll('[data-i18n-aria]')) el.setAttribute('aria-label', t(el.dataset.i18nAria));
    for (const el of document.querySelectorAll('[data-i18n-alt]')) el.alt = t(el.dataset.i18nAlt);
    $('call112').href = `tel:${number}`;
  }

  function render(d) {
    last = d;
    const number = I18N.emergency;
    const texts = {
      ok: [t('okTitle', { name: d.name, gender: d.gender }), t('okDetail', { last: d.lastCheckInAt && time(d.lastCheckInAt), next: d.nextCheckInDue && time(d.nextCheckInDue) })],
      overdue: [t('overdueTitle', { name: d.name, gender: d.gender }), t('overdueDetail', { due: d.nextCheckInDue && time(d.nextCheckInDue), number })],
      alarm: [t('alarmTitle', { name: d.name, gender: d.gender }), t('alarmDetail', { time: d.alarmAt && time(d.alarmAt), number })],
      ended: [t('endedTitle'), t(d.hadAlarm ? 'endedDetailAlarm' : 'endedDetail', { name: d.name, gender: d.gender })],
    };
    const [title, detail] = texts[d.status];
    $('status').className = `card status ${d.status}`;
    $('title').textContent = title;
    $('detail').textContent = detail;
    $('call112').hidden = !(d.status === 'alarm' || d.status === 'overdue');
    $('footer').textContent = d.status === 'ended' ? '' : t('footer', { name: d.name });

    $('partner').hidden = !d.partner;
    if (d.partner) {
      $('partnerLead').textContent = t('partnerLead');
      $('partnerName').textContent = `${d.partner.name}, ${d.partner.age}`;
      $('meetInfo').textContent = `${dateTime(d.meetAt)} · ${d.place}`;
      $('partnerPhoto').hidden = !d.partner.hasPhoto;
      if (d.partner.hasPhoto && !$('partnerPhoto').src) $('partnerPhoto').src = `/api/share/${token}/partner-photo`;
    }

    $('mapWrap').hidden = !d.location;
    if (d.location) {
      const { lat, lng, accuracy, battery, at } = d.location;
      $('locInfo').textContent = [ago(at), battery != null ? t('battery', { percent: percent(battery) }) : null].filter(Boolean).join(' · ');
      $('openMaps').href = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
      if (window.L) {
        if (!map) {
          map = L.map('map', { zoomControl: false, attributionControl: true }).setView([lat, lng], 16);
          L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
          marker = L.circleMarker([lat, lng], { radius: 9, color: '#121014', weight: 3, fillColor: '#62E0B5', fillOpacity: 1 }).addTo(map);
          circle = L.circle([lat, lng], { radius: accuracy || 0, color: '#62E0B5', weight: 1, fillOpacity: 0.12 }).addTo(map);
        } else {
          marker.setLatLng([lat, lng]);
          circle.setLatLng([lat, lng]).setRadius(accuracy || 0);
        }
      }
    }
  }

  async function refresh() {
    try {
      const res = await fetch(`/api/share/${token}`, { cache: 'no-store' });
      if (res.status === 404) {
        last = null;
        $('title').textContent = t('linkExpired');
        $('detail').textContent = '';
        return;
      }
      render(await res.json());
    } catch {
      $('detail').textContent = t('loadFailed');
    }
  }

  // Server neměl podle čeho jazyk vybrat (bez ?lang= a bez Accept-Language) → zkusit jazyky zařízení.
  // Když se slovník nenačte, zůstane vložený – stránka musí fungovat vždycky.
  async function refineLocale() {
    const tags = navigator.languages?.length ? navigator.languages : navigator.language ? [navigator.language] : [];
    if (I18N.explicit || tags.length === 0) return;
    try {
      const res = await fetch(`/api/share/i18n/${encodeURIComponent(tags.join(','))}`);
      if (!res.ok) return;
      const next = await res.json();
      if (!next?.messages || next.locale === I18N.locale) return;
      I18N = { ...next, explicit: true };
      applyStatic();
      if (last) render(last);
    } catch {
      // necháme vložený jazyk
    }
  }

  refresh();
  refineLocale();
  setInterval(refresh, 15000);
</script>
</body>
</html>
