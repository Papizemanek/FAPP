# Testy, typy, překlady a zranitelné závislosti při každém pushi a pull requestu.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: node shared/i18n/check.mjs
      # Produkční závislosti serveru nesmí mít známou zranitelnost (vysokou ani střední).
      - run: npm audit --omit=dev -w server --audit-level=moderate
      # Nástroje pro sestavení aplikace jen hlásíme (neběží na serveru ani u uživatelů).
      - run: npm audit --omit=dev -w app --audit-level=critical
